<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sidebar EduGrade</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/50fc8e13f364d62f2b7085bdced88cc1">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Menu chính" style="width: 100%; min-width: 0; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #0a0a0a; background: #fafafa; display: flex; flex-direction: column">
<div style="height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #e5e5e5">
<span style="width: 40px; height: 40px; border-radius: 14px; background: #155dfc; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; flex: none">EG</span>
<span style="display: flex; flex-direction: column; line-height: 1.2"><b style="font-size: 16px">EduGrade</b><span style="font-size: 11px; color: #737373">Hệ thống Quản lý Trung tâm</span></span>
</div>
<div style="padding: 16px 12px; display: flex; flex-direction: column; gap: 24px">
<sc-for list="{{groups}}" as="group" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0 0 4px; padding: 0 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #737373">{{group.title}}</p>
<sc-for list="{{group.items}}" as="item" hint-placeholder-count="2">
<a href="#" style="{{item.style}}"><img src="{{item.icon}}" alt="" style="width: 20px; height: 20px; flex: none"><span style="flex: 1 1 auto">{{item.label}}</span><sc-if value="{{item.badge}}" hint-placeholder-val="{{false}}"><span style="{{item.badgeStyle}}">{{item.badge}}</span></sc-if></a>
</sc-for>
</div>
</sc-for>
</div>
</nav>
</x-dc>
