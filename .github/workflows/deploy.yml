name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: deploy-frontend-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/wdp301-se1921/edugrade-web:${{ github.sha }}
            ghcr.io/wdp301-se1921/edugrade-web:${{ github.sha }}
            ghcr.io/wdp301-se1921/edugrade-web:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true
            image=ghcr.io/wdp301-se1921/edugrade-web:${{ github.sha }}
            deploy_status=0
            /home/deploy/edugrade/deploy.sh web "$image" || deploy_status=$?
            # The deploy script's immediate curl can reset while Next is still starting.
            # Accept recovery only when a running container uses this exact immutable image.
            for attempt in $(seq 1 40); do
              container=$(docker ps -q --filter "ancestor=$image" | head -n 1)
              if [ -n "$container" ] && [ "$(docker inspect -f '{{.Config.Image}}' "$container")" = "$image" ]; then
                public_origin='${{ vars.PUBLIC_WEB_ORIGIN }}'
                public_origin=${public_origin:-https://edugrade.45.77.168.110.sslip.io}
                if docker exec "$container" node -e "fetch('$public_origin/api/health',{cache:'no-store',signal:AbortSignal.timeout(5000)}).then(async r=>{const b=await r.json();process.exit(r.ok&&b.status==='ok'&&b.commit==='${{ github.sha }}'?0:1)}).catch(()=>process.exit(1))"; then
                  exit 0
                fi
              fi
              sleep 3
            done
            echo "The requested frontend image did not become ready (deploy exit $deploy_status)."
            exit 1
